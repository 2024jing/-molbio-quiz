<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>營養分子生物學 習作練習</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* VOICE: calm study tool, same family as the user's 生化測驗
   IDEA: a workbook page — one question card at a time, answer key revealed after answering
   PICTURE: the question card itself
   COLOUR and TYPE: teal accent on pale ground, Noto Sans TC + IBM Plex Mono numerals
   LAYOUT: sticky header with unit tabs and progress, single column card */
:root{color-scheme:light;
  --bg:#f3f6f4; --surface:#ffffff; --ink:#17231f; --muted:#5b6b65; --line:#d6e0db;
  --accent:#0f5e8c; --accent-soft:#dcebf5; --yolk:#f2b632; --yolk-soft:#fdf1d4;
  --good:#1d8a4c; --good-soft:#e2f4e8; --bad:#c2402e; --bad-soft:#fbe6e2;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1517; --surface:#172025; --ink:#e7eef2; --muted:#9fb0b8; --line:#2a3a40;
  --accent:#6cb8e6; --accent-soft:#18303e; --yolk:#f2c45a; --yolk-soft:#3a2f14;
  --good:#5bd38d; --good-soft:#163323; --bad:#ff8a77; --bad-soft:#3b1e19; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1517; --surface:#172025; --ink:#e7eef2; --muted:#9fb0b8; --line:#2a3a40;
  --accent:#6cb8e6; --accent-soft:#18303e; --yolk:#f2c45a; --yolk-soft:#3a2f14;
  --good:#5bd38d; --good-soft:#163323; --bad:#ff8a77; --bad-soft:#3b1e19; color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.65;overflow-x:clip}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 48px}
header{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.head-in{max-width:720px;margin:0 auto;padding:10px 16px 10px;display:grid;gap:8px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.eyebrow{font-size:12px;color:var(--muted)}
h1{margin:0;font-size:19px;font-weight:900;text-wrap:balance}
.units{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.units button{flex:none;font:inherit;font-size:13px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:99px;padding:5px 11px;cursor:pointer;min-height:34px}
.units button.on{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:700}
.units button .d{font-family:var(--f-mono);font-size:11px;opacity:.8;margin-left:4px}
.stats{font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink)}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.gridbtn{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:4px 10px;cursor:pointer;min-height:32px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;padding-block:6px 2px;max-height:40vh;overflow-y:auto}
.grid button{font-family:var(--f-mono);font-size:13px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.grid button.ok{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.grid button.no{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.grid button.cur{outline:2px solid var(--accent);outline-offset:1px}
main{padding-top:18px;display:grid;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 18px;display:grid;gap:16px}
.qnum{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.qnum span{font-family:var(--f-mono);font-size:13px;background:var(--accent-soft);color:var(--accent);padding:2px 10px;border-radius:99px}
.tag{font-size:12px;background:var(--yolk-soft);color:var(--ink);padding:2px 8px;border-radius:6px;border:1px solid var(--yolk)}
.stem{font-size:17px;font-weight:500;margin:0;overflow-wrap:anywhere}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;font:inherit;font-size:15px;line-height:1.55;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;width:100%;overflow-wrap:anywhere}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt:focus-visible,.nav button:focus-visible,.gridbtn:focus-visible,.grid button:focus-visible,.units button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.opt .k{font-family:var(--f-mono);flex:0 0 26px;height:26px;border-radius:7px;display:grid;place-items:center;background:var(--bg);font-size:13px}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .k{background:var(--good);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);color:var(--surface)}
.opt.dim{opacity:.55}
.verdict{font-weight:900;font-size:16px}
.verdict.ok{color:var(--good)} .verdict.no{color:var(--bad)}
.exp{border-top:1px dashed var(--line);padding-top:14px;display:grid;gap:10px}
.exp p{margin:0}
.exp ul{margin:0;padding-left:1.2em;display:grid;gap:4px;color:var(--muted);font-size:14.5px}
.exp ul b{color:var(--ink)}
.ref{font-size:13.5px;background:var(--yolk-soft);border-left:3px solid var(--yolk);padding:8px 12px;border-radius:0 8px 8px 0}
.ref a{color:var(--accent)}
.warn{font-size:13.5px;background:var(--bad-soft);border-left:3px solid var(--bad);padding:8px 12px;border-radius:0 8px 8px 0}
.nav{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
.nav button{font:inherit;font-weight:700;font-size:15px;padding:10px 18px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;min-height:44px}
.nav button.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.nav button[disabled]{opacity:.4;cursor:default}
.hint{font-size:13px;color:var(--muted);text-align:center;margin:0}
.result h2{margin:0;font-size:22px}
.big{font-family:var(--f-mono);font-size:44px;font-weight:500;color:var(--accent);line-height:1.1}
.wronglist{display:flex;flex-wrap:wrap;gap:6px}
.wronglist button{font-family:var(--f-mono);font-size:13px;border:1px solid var(--bad);background:var(--bad-soft);color:var(--bad);border-radius:8px;padding:4px 10px;cursor:pointer;min-height:32px}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style></head>
<body>
<header>
  <div class="head-in">
    <div class="row">
      <div>
        <div class="eyebrow">營養分子生物學 · 習作練習（葉景生老師單元 1～10）</div>
        <h1 id="utitle">單元 1</h1>
      </div>
      <div class="stats" id="stats"></div>
    </div>
    <div class="units" id="units" role="tablist" aria-label="選擇單元"></div>
    <div class="bar" aria-hidden="true"><i id="barfill"></i></div>
    <div class="row">
      <button class="gridbtn" id="toggleGrid" aria-expanded="false" aria-controls="grid">題號總覽</button>
      <span class="eyebrow">作答後才會出現解析</span>
    </div>
    <div class="grid" id="grid" hidden></div>
  </div>
</header>
<div class="wrap"><main id="main"></main>
<p class="hint" style="margin-top:20px">答案由 Claude 依講義判斷（習作原檔未附答案）；標 ⚠ 的題目建議向老師確認。</p></div>

<script>
window.UNITS[1]={"q": [{"s": "根據人類遺傳因子計畫(human genome project)的研究結果，人類的遺傳因子大約包含多少基因(genes)？", "o": ["0.5~1萬個", "1~2萬個", "3~3.5萬個", "4~5萬個", "9萬個以上"], "a": 2, "e": "講義 S4：人類基因組 2003 年定序完成，約有 30,000–35,000 個基因，依講義答 3～3.5 萬個。", "x": [], "r": "第 1 講 1-1 分子生物學的里程碑", "w": "近年估計人類蛋白質編碼基因約 2 萬個（選項 B）。考試請依老師講義的數字作答。"}, {"s": "下列何種狀況下，基因的自由分配會發生哪裡？", "o": ["基因位在同源染色體上", "基因位在姊妹染色體上", "基因位在同一染色體上", "基因位在非同源染色體上"], "a": 3, "e": "獨立（自由）分配律要成立，兩對基因必須位在<b>非同源染色體</b>上，減數分裂時各自分到配子，互不影響。", "x": ["A：同源染色體上的是「等位基因」，那是分離律", "B、C：在同一條染色體（或其姊妹染色分體）上的基因會連鎖，一起遺傳，不遵守自由分配"], "r": "第 1 講 1-1 分子生物學的里程碑（孟德爾第二定律）"}, {"s": "根據孟德爾遺傳法則，試問下列敘述何者錯誤？", "o": ["兩個有相同表現型的個體，可有不同的基因型", "個體中每一性狀皆由兩個等位基因(alleles)控制，它們分別來自父母雙方", "人類的身高適用孟德爾遺傳法則", "分離律是指控制同一性狀之等位基因相互分離", "一顯性個體和一隱性個體交配，不會產生半顯性個體"], "a": 2, "e": "身高由許多基因共同決定，再加上營養等環境因素，是<b>多基因遺傳</b>（計量遺傳學），不符合孟德爾單一基因的顯隱性法則。", "x": ["A：AA 與 Aa 外表都是顯性，表現型相同、基因型不同（正確）", "E：完全顯性時，顯性與隱性交配只會得到顯性子代，不會出現中間型（正確）"], "r": "第 1 講 1-1 分子生物學的里程碑（孟德爾第一定律）"}, {"s": "孟德爾的分離律(law of segregation)與自由分配律(independent assortment)，與細胞生物學家對下列何種細胞活動時染色體的觀察相符合的現象?", "o": ["細胞質分割", "有絲分裂", "減數分裂", "染色體不分離"], "a": 2, "e": "兩條定律在細胞上的根據都是<b>減數分裂</b>：同源染色體分開（分離律），不同對染色體隨機排列（獨立分配律）。", "x": ["B：有絲分裂後子細胞染色體與母細胞相同，沒有分離", "D：染色體不分離是異常，會造成唐氏症等非整倍體"], "r": "第 1 講 1-1 分子生物學的里程碑"}, {"s": "關於孟德爾的「分離律」，下列敘述何者錯誤？", "o": ["生物的遺傳性狀是由基因控制，且控制性狀的基因有兩種，一為顯性，一為隱性", "控制一種性狀的基因是成對存在的，形成配子時，會互相分離至配子中", "當顯性基因與隱性基因相遇時，只有顯性性狀會表現出來", "形成配子時，一對基因的分離，對另一對基因的分離沒有影響"], "a": 3, "e": "D 描述的是「一對基因的分離不影響另一對」——這是<b>獨立分配律（第二定律）</b>，不是分離律，所以錯。", "x": ["A、B、C 都是分離律的內容（一對因子、成對存在、配子形成時分開、顯性蓋過隱性）"], "r": "第 1 講 1-1 分子生物學的里程碑"}, {"s": "下列何者為孟德爾的獨立分配律(independent assortment)？", "o": ["不同的性狀特徵各自獨立分配給下一代", "控制性狀的基因有顯性與隱性兩種型式", "每一種生物的性狀是由該種生物的遺傳因子所決定,與他種生物無關", "成對的基因可獨立分配進入配子中"], "a": 0, "e": "獨立分配律講的是<b>不同性狀</b>（不同對基因）各自獨立傳給下一代，例如豌豆的顏色和形狀互不影響。", "x": ["B：顯隱性是分離律的內容", "C：與遺傳定律無關", "D：「成對的基因分開進入配子」是分離律"], "r": "第 1 講 1-1 分子生物學的里程碑"}, {"s": "依據孟德爾實驗，在何種情況下，基因會遵守「獨立分配律」？", "o": ["兩對等位基因在一對染色體上，形成配子時", "精子與卵結合時", "一對等位基因形成配子時", "兩對等位基因位在不同對染色體，形成配子時"], "a": 3, "e": "獨立分配律的條件：<b>兩對</b>等位基因、位在<b>不同對</b>染色體、<b>形成配子時</b>。", "x": ["A：在同一對染色體上會連鎖", "B：受精是配子結合，不是分配", "C：只有一對基因時談的是分離律"], "r": "第 1 講 1-1 分子生物學的里程碑"}, {"s": "下列哪一位科學家提出「天擇說」，使生物的演變得到合理的解釋？", "o": ["虎克", "達爾文", "孟德爾", "達文西"], "a": 1, "e": "達爾文 1859 年《物種原始》提出天擇說（變異、過度繁殖、生存競爭、適者生存）。", "x": ["A：虎克命名「細胞」", "C：孟德爾是遺傳學之父", "D：達文西是藝術家"], "r": "第 1 講 1-1 分子生物學的里程碑（達爾文天擇說）"}, {"s": "有關於格里夫茲(Frederick Griffith)實驗的敘述，下列何者錯誤？", "o": ["粗糙型(R型)是不具有致病性", "光滑型(S型)是具有致病性", "性狀轉變(transformation)可改變而成為有莢膜的肺炎雙球菌", "加熱可破壞S菌株的DNA"], "a": 3, "e": "加熱殺死 S 菌主要是讓<b>蛋白質</b>變性；DNA 加熱後降溫可以復性，仍保有轉化能力——正因如此，死 S 菌的 DNA 才能讓 R 菌轉型。", "x": ["A、B：R 型無莢膜不致病、S 型有莢膜致病（正確）", "C：轉型後的 R 菌會長出莢膜（正確）"], "r": "第 1 講 1-1 分子生物學的里程碑（格里夫茲實驗）"}, {"s": "下列有關格里夫茲實驗的敘述，何者正確？", "o": ["所用的S型肺炎雙球菌因具莢膜使菌體外表光滑，所以稱為光滑型", "結果證實R型肺炎雙球菌的遺傳物質可進入用熱殺死的S型菌體內使其復活", "熱殺死的S型肺炎雙球菌之遺傳物質可進入R型肺炎球菌，使其發生轉型作用", "結果證實使S型肺炎球菌轉型成R型肺炎雙球菌的物質是DNA"], "a": 2, "e": "熱死 S 菌的遺傳物質（後來證實是 DNA）進入活的 R 菌，使 R 菌轉型成 S 菌。", "x": ["A：「光滑」指的是<b>菌落</b>外觀，不是單一菌體表面，題目寫法不精確", "B：方向相反，是 S 的物質進入 R，死菌也不會復活", "D：方向錯（R 轉成 S），且格里夫茲本人沒有證明是 DNA（那是艾佛瑞）"], "r": "第 1 講 1-1 分子生物學的里程碑（格里夫茲實驗）"}, {"s": "細菌質體(plasmid)為獨立於染色體外的環狀DNA，可用於將基因帶入菌體中(如大腸桿菌)，此質體送入菌體的過程稱為：", "o": ["transformation(轉形作用)", "amplification(放大作用)", "electroporation(電脈衝穿孔術)", "construction(構築作用)"], "a": 0, "e": "把外來 DNA（如質體）送進細菌、使其獲得新性狀，稱為<b>轉形作用</b>（transformation），和格里夫茲實驗是同一個詞。", "x": ["C：電脈衝穿孔是把 DNA 送進細胞的「方法」之一，不是這個過程的名稱", "B、D：放大、構築都不是"], "r": "第 10 講 (6) 重組 DNA 技術；第 1 講 格里夫茲實驗"}, {"s": "若將由已殺死有莢膜(capsule)之肺炎雙球菌提取之內含物中加入下列何種物質，則不能使無莢膜R型肺炎雙球菌變成有莢膜S型肺炎菌？", "o": ["蛋白酶(protease)", "RNA酶", "DNA酶", "加熱100℃後慢慢冷卻", "脂肪酶(lipase)"], "a": 2, "e": "艾佛瑞的實驗：只有加入 <b>DNA 酶</b>把 DNA 分解掉，轉化才會消失；分解蛋白質、RNA、脂質都還能轉化。", "x": ["D：加熱後慢慢冷卻，DNA 會復性，仍有轉化力", "A、B、E：破壞的不是遺傳物質"], "r": "第 1 講 1-1 分子生物學的里程碑（格里夫茲實驗）"}, {"s": "下列有關於R型肺炎雙球球菌在實驗鼠中所產的子代之推論，何者正確？", "o": ["外表型改變而基因型不變", "基因型改變而外表型不變", "外表型隨基因型的改變而變", "基因型隨外表型的改變而變"], "a": 2, "e": "R 菌吸收了 S 菌的 DNA，<b>基因型先改變</b>，於是長出莢膜，外表型跟著改變；而且能穩定遺傳給後代。", "x": ["A、B：兩者是一起改變的", "D：因果顛倒——是基因決定外表，不是外表改變基因"], "r": "第 1 講 1-1 分子生物學的里程碑"}, {"s": "若取放射性同位素32P和35S，分別標記在噬菌體的核 酸及蛋白質外殼上，以此病毒感染寄主後立即做放射 性同位素測定，則下列什麼構造會呈現放射性同位素32P和35S？", "o": ["寄主細胞內有32P，細胞外有35S", "寄主細胞內有35S，細胞外有32P", "寄主細胞內有32P和35S，細胞外則無", "寄主細胞外有32P和35S，細胞內則無"], "a": 0, "e": "噬菌體只把 <b>DNA（³²P）</b>注入細菌，<b>蛋白質外殼（³⁵S）</b>留在細胞外。", "x": [], "r": "第 1 講 1-1 分子生物學的里程碑（赫雪－蔡斯實驗）"}, {"s": "下列敘述何者錯誤？", "o": ["生物愈高等其細胞所含的染色體數目愈多", "Watson-Crick(華生-克立克)認為DNA的複製是以半保留方式(semiconservative)進行", "Sanger發展出蛋白質與核酸定序方法，兩度獲得諾貝爾獎", "有些病毒DNA在生命週期的一段時間是單股的"], "a": 0, "e": "染色體數目和生物高等與否無關，例如人類 46 條，馬鈴薯 48 條、狗 78 條、某些蕨類上千條。", "x": ["B：華生與克里克依鹼基互補提出半保留複製（正確）", "C：Sanger 兩度獲諾貝爾化學獎（胰島素定序、DNA 定序）（正確）", "D：如某些病毒的 DNA 是單股（正確）"], "r": "第 1 講 1-1 分子生物學的里程碑"}, {"s": "根據Watson-Crick(華生-克立克)的DNA模式，有關兩股核苷酸鏈結合的力量，下列何者為非？", "o": ["鹼基間的堆積力量(stacking of the bases)", "磷酸根與鹼基間之離子交互作用(ionic interaction)", "各鹼基間所形成的氫鍵(hydrogen bonds between bases)", "鹼基間所產生的凡得瓦爾交互作用(Van der Waals interaction)"], "a": 1, "e": "維持兩股結合的是<b>鹼基間氫鍵</b>與<b>鹼基堆積力</b>（含凡得瓦力、疏水作用）。磷酸根帶負電，在外側反而互相排斥，不是靠它和鹼基的離子作用結合。", "x": [], "r": "第 1 講 1-2 DNA 的結構（雙股螺旋的結構特徵）"}, {"s": "有關核苷酸(nucleotides)之敘述，下列何者正確？", "o": ["核苷酸(nucleotides)結構由1個五碳糖(pentose)、1個含氮鹼基(nitrogenous base group)及至少1個磷酸基團(phosphate group)所組成", "核苷(nucleosides)可利用磷酸二酯鍵(phosphodiester bond)形成核苷酸(nucleotides)", "核苷酸(nucleotides)在280 nm波長下有較大吸光值", "ATP、CTP、GTP及UTP等核苷酸(nucleotides)皆可作為合成DNA之原料"], "a": 0, "e": "核苷酸＝五碳糖＋含氮鹼基＋至少一個磷酸（可有 1～3 個，如 AMP、ADP、ATP）。", "x": ["B：核苷加磷酸是酯鍵；磷酸二酯鍵是連接相鄰核苷酸", "C：核酸吸收 260 nm；280 nm 是蛋白質", "D：合成 DNA 要用 dATP、dCTP、dGTP、dTTP"], "r": "第 1 講 1-2 DNA 的結構（核苷酸）"}, {"s": "對於嘌呤核苷酸(purine nucleotides)分解的敘述，下列何者正確？", "o": ["人體內嘌呤核苷酸分解過程是由核苷酸(nucleotides)降解為核苷(nucleosides)，再由核苷降解為鹼基，最後形成終產物", "人體內嘌呤核苷酸分解過程包括還原作用(reduction)與轉胺作用(transamination)", "人體內具有酵素可將嘌呤環狀結構打開而形成中間產物尿囊素(allantoin)", "人體內分解嘌呤之最終產物為尿素(urea)"], "a": 0, "e": "人體分解嘌呤：核苷酸 → 去磷酸成核苷 → 切成鹼基 → 次黃嘌呤 → 黃嘌呤 → 尿酸。", "x": ["B：主要是水解、去胺與氧化，不是還原與轉胺", "C：人類沒有尿酸氧化酶，無法開環成尿囊素", "D：終產物是尿酸；尿素來自胺基酸"], "r": "第 1 講 1-2 DNA 的結構（核酸代謝補充）"}, {"s": " window.UNITS[3]={"q": [{"s": "有關於外在環境因子引起的誘導突變，下列敘述何者錯誤？", "o": ["輻射線、病毒、化學藥品，均屬於誘變劑", "紫外線會使DNA斷裂或改變DNA的鹼基成分", "有色人種因為具有黑色素，故皮膚癌細胞不易擴散，較容易治療", "化學藥物可誘發DNA突變而致癌"], "a": 2, "e": "黑色素能減少紫外線傷害、降低罹患率，但一旦得了皮膚癌（如黑色素瘤），<b>不會因膚色而較易治療</b>。", "x": ["A、B、D：輻射、病毒、化學物都是誘變劑；UV 造成二聚體或斷裂（正確）"], "r": "第 3 講 一、突變的分類與誘變劑"}, {"s": "下列有關突變的敘述，何者正確？", "o": ["大部分突變對個體有害，故突變完全無益於生物的演化", "導致基因突變的理化因素可能引起癌症", "隱性突變基因可藉同型合子型式保存在族群中", "鐮形血球性貧血是因一個含氮鹽基的缺失引起"], "a": 1, "e": "會傷害 DNA 的物理、化學因子（UV、輻射、致癌物）可能引起癌症。", "x": ["A：突變是演化的原料", "C：隱性突變主要藏在<b>異型合子</b>（帶因者）中保存", "D：鐮刀型貧血是單一鹼基<b>取代</b>，不是缺失"], "r": "第 3 講 一、突變的分類與誘變劑"}, {"s": "下列有關突變的敘述，何者錯誤？", "o": ["自然突變產生的機率極低", "突變對個體而言都是有害的", "X-光、紫外線會增加基因的突變機率", "防腐劑、漂白劑可能造成基因的突變"], "a": 1, "e": "突變大多中性或有害，但<b>也有有益</b>的（演化的原料），所以「都有害」錯。", "x": [], "r": "第 3 講 一、突變的分類與誘變劑"}, {"s": "已知突變能夠以下列各種方式導致蛋白質分子之改變，唯獨何者除外？", "o": ["單一胺基酸殘基之取代", "不完整多肽鏈之合成", "被合成之正常蛋白質數量減低", "在不改變胺基酸之正常序列之情況下，使得三度空間結構發生變化", "單一多肽鏈上超過一個以上之胺基酸殘基的改變"], "a": 3, "e": "突變改變的是 DNA 序列；胺基酸序列完全不變卻改變立體結構，不是突變造成蛋白改變的方式。", "x": ["A：錯義", "B：無義或移碼造成截短", "C：啟動子突變使產量下降", "E：移碼使後面一串胺基酸都改變"], "r": "第 3 講 一、依效應分類的突變（錯義／無義／沉默／移碼）"}, {"s": "下列有關基因突變(gene mutation)的敘述，何者正確？", "o": ["食品若添加亞硝酸鹽(nitric acid)一定會引起基因突變", "紫外線可破壞DNA導致突變，而引起皮膚癌", "鐮形血球貧血症是單一胺基酸插入的突變所致", "輻射線會誘導DNA的五碳糖發生變異導致基因突變"], "a": 1, "e": "紫外線使相鄰胸腺嘧啶形成<b>二聚體</b>，修不好會突變並導致皮膚癌（如著色性乾皮症）。", "x": ["A：亞硝酸鹽「可能」致突變，不是「一定」", "C：鐮刀型貧血是胺基酸<b>取代</b>，不是插入", "D：輻射主要造成鹼基傷害與斷裂，不是改變五碳糖"], "r": "第 3 講 一、DNA 損害的類型（紫外線與嘧啶二聚體）"}, {"s": "若在右圖中〔原題附圖〕交叉處斷裂即可造成下列何種現象？", "o": ["重複(duplication)", "缺失(deletion)", "倒位(inversion)", "易位(translocation)"], "a": 2, "e": "<b>倒位</b>：同一條染色體扭成環、在交叉處斷裂後片段反向接回。", "x": ["A：重複", "B：缺失", "D：易位發生在兩條非同源染色體之間"], "r": "第 3 講 一、染色體結構改變", "w": "原題附圖無法讀出，依常見圖型（單條染色體扭轉成環）作答；若老師給的圖是兩條不同染色體交叉，答案應是易位（D）。"}, {"s": "基因變異，即所謂的：", "o": ["基因刪除(gene deletion)", "點突變(point mutation)", "多樣性(polymorphism)", "基因重組(gene rearrangement)"], "a": 2, "e": "族群中同一基因存在不同版本（常見的變異）稱為<b>多型性</b>（polymorphism）。", "x": ["A、B、D：都只是一種特定的變異方式"], "r": "第 3 講 一、突變的分類與誘變劑", " 基因的轉錄(transcription)？", "o": ["胰島素(insulin)", "類固醇激素(steroid horomones)", "升糖激素(glucagon)", "兒茶酚胺(catecholamines)"], "a": 1, "e": "<b>類固醇激素</b>脂溶性，可穿過細胞膜，與細胞內受體結合後進入核內，直接結合 DNA 調控轉錄。", "x": ["A、C、D：都是水溶性，作用在細胞膜受體"], "r": "第 6 講 一、細胞核受體與 PPAR"}, {"s": "下列何者造成DNA緊緊纏繞住組織蛋白(histones)，以避免進行轉錄作用？", "o": ["methylation(甲基化)", "acetyl CoA(乙醯輔酶A)", "nitrogenation(氮化作用)", "dehydration(脫水作用)"], "a": 0, "e": "DNA（CpG）<b>甲基化</b>（以及組蛋白特定位置甲基化）使染色質緊縮、抑制轉錄。", "x": ["B：乙醯輔酶 A 是乙醯基的來源，乙醯化反而使染色質鬆開"], "r": "第 6 講 三、CpG 與 CpG 島；第 6 講 二、染色質重塑與組蛋白修飾"}, {"s": "下列有關組蛋白(histones)、去氧核醣核酸(DNA)的化學修飾與基因表現與否的配對關係，何者正確？", "o": ["DNA甲基化、histones去乙醯化，DNA濃縮，利於基因表現", "DNA去甲基化、histones乙醯化，DNA鬆散，利於基因表現", "histones甲基化、DNA 去乙醯化，DNA濃縮，不利於基因表現", "histones 去甲基化、DNA乙醯化，DNA鬆散，不利於基因表現"], "a": 1, "e": "<b>DNA 去甲基化＋組蛋白乙醯化 → 染色質鬆散 → 利於表現</b>。", "x": ["A：甲基化＋去乙醯化會濃縮、不利表現", "C、D：DNA 本身不做乙醯化"], "r": "第 6 講 二、染色質重塑與組蛋白修飾"}, {"s": "細胞核中基因與相關蛋白質連結形成可見的物質，稱為：", "o": ["chromatin(染色質)", "chlorophyll(葉綠素)", "chloroplast(葉綠體)", "chromatophore(色素細胞)"], "a": 0, "e": "基因（DNA）與蛋白質結合成的物質稱<b>染色質</b>。", "x": [], "r": "第 1 講 染色質與染色體"}, {"s": "在一些基因的啟動子(promoter)上常有一些CpG島(CpG island)。同一基因的表現，常因CpG島受到下列何種修飾(modification)而有不同？", "o": ["乙醯化(acetylation)", "甲基化(methylation)", "磷酸化(phosphorylation)", "羧化(carboxylation)"], "a": 1, "e": "啟動子上 CpG 島的<b>甲基化</b>程度決定基因開或關。", "x": [], "r": "第 6 講 三、CpG 與 CpG 島"}, {"s": "當DNA形成10 nm和30 nm纖維狀染色質結構時，染色質的結構要如何改變，才能使染色質解除構形(conformation)以進行基因表現？", "o": ["DNA必須以剪接體(spliceosome)切割以進行基因轉錄", "必須以組蛋白(histone) H1進行DNA超螺旋結構", "核苷酸要切除並重組", "組蛋白要進行乙醯化(acetylation)和磷酸化(phosphorylation)"], "a": 3, "e": "組蛋白<b>乙醯化</b>（中和正電）和磷酸化使組蛋白與 DNA 結合變鬆，染色質才能打開轉錄。", "x": ["A：剪接體處理 RNA", "B：H1 使染色質更緊", "C：不會切除 DNA"], "r": "第 6 講 二、染色質重塑與組蛋白修飾"}, {"s": "以磷酸化/去磷酸化(phosphorylation/dephosphorylation)調控酵素活性的過程中，對酵素的共價修飾可發生在哪些胺基酸上：", "o": ["Asp, Glu and His", "Ser, Thr and Tyr", "Ser, Asp and Lys", "Tyr, Phe and Trp"], "a": 1, "e": "磷酸化發生在有 –OH 的 <b>Ser、Thr、Tyr</b>。", "x": [], "r": "第 6 講 二、染色質重塑與組蛋白修飾 <span class='add'>補充</span>"}, {"s": "因DNA組蛋白複合物的改變而增加轉錄的活性，被稱為下列何種作用？", "o": ["基因調控", "核小體的形成", "染色質重塑", "DNA甲基化", "誘導突變"], "a": 2, "e": "改變 DNA–組蛋白複合物、使轉錄更容易＝<b>染色質重塑</b>。", "x": [], "r": "第 6 講 二、染色質重塑與組蛋白修飾"}, {"s": "於真核細胞中，與轉錄調節有關的作用為？", "o": ["DNA乙醯化以及組蛋白擴增", "DNA擴增以及組蛋白甲基化", "DNA乙醯化以及甲基化", "DNA甲基化以及組蛋白修飾作用"], "a": 3, "e": "真核轉錄調節常用 <b>DNA 甲基化</b>與<b>組蛋白修飾</b>。", "x": ["A、C：DNA 本身不做乙醯化"], "r": "第 6 講 二、染色質重塑與組蛋白修飾；第 6 講 三、CpG 與 CpG 島"}, {"s": "基因體印記(genomic imprinting)，DNA甲基化(DNA methylation)與組蛋白乙醯化(histone acetylation)是屬於下列何者選項的例子？", "o": ["基因突變", "染色體重組(rearrangements)", "核型(karyotypes)", "附基因的遺傳(epigenetic inheritance)"], "a": 3, "e": "不改變 DNA 序列、卻能傳給子細胞的調控＝<b>表觀遺傳</b>（附基因遺傳）。", "x": [], "r": "第 6 講 三、基因體印記 Genomic Imprinting"}, {"s": "下列哪一些現象與基因DNA甲基化(methylation)有關？甲：基因體印記(genomic imprinting)，乙：染色體轉位(chromosome translocation)，丙：X染色體不活化(X chromosome inactivation)？", "o": ["只與丙有關", "甲和乙", "甲和丙", "乙和丙"], "a": 2, "e": "基因體印記（甲）與 X 染色體不活化（丙）都靠 DNA 甲基化；染色體轉位（乙）是結構改變。", "x": [], "r": "第 6 講 三、基因體印記 Genomic Imprinting；第 6 講 三、X 染色體去活化與巴爾氏體"}, {"s": "下列哪一個不屬於已知的表觀遺傳機制(epigenetic mechanism)？", "o": ["DNA甲基化(methylation)", "轉譯後的多樣修飾功能，如藉由改變組蛋白(histone)尾端或染色體的結構", "微小RNA (micro RNAs)", "RNA乙醯化"], "a": 3, "e": "表觀遺傳包括 DNA 甲基化、組蛋白修飾、非編碼 RNA（如 miRNA）；<b>RNA 乙醯化</b>不是已知的主要機制。", "x": [], "r": "第 6 講 三、基因體印記 Genomic Imprinting"}, {"s": "DNA甲基化(DNA methylation)、組蛋白乙醯化(histone acetylation)以及X染色體不活化(X inactivation)屬於下列何種現象？", "o": ["遺傳突變(genetic mutation)", "染色體轉位(chromosomal translocation)", "表觀遺傳的控制(epigenetic control)", "反遺傳的改變(reverse genetic changes)"], "a": 2, "e": "三者都是<b>表觀遺傳控制</b>。", "x": [], "r": "第 6 講 三、基因體印記 Genomic Imprinting"}, {"s": "巴爾小體(Barr body)係穆雷·巴爾(Murray Barr)於雌性哺乳動物細胞內所發現，它是一種X性染色體形成的緊密結構，經過染色後在顯微鏡下可見。下列有關巴爾小體的敘述，何者正確？", "o": ["每個雌性哺乳動物的細胞都具有兩個巴爾小體", "形成巴爾小體的X性染色體具有強化基因表現的功能", "如果控制體 色深淺的等位基因位於X性染色體上，則此個體有可能成為深淺分佈不均的體色", "雄性哺乳動物不具巴爾小體，主要原因 係受到Y 染色體的抑制，故細胞是否具有巴爾小體與性別有關"], "a": 2, "e": "每個細胞<b>隨機</b>關掉一條 X，若體色基因在 X 上，異型合子會出現深淺不均的斑塊（如三花貓）。", "x": ["A：正常雌性只有一個巴爾小體", "B：巴爾小體的 X 是被關掉的"   if(done){const ok=picked===it.a;
    h+=`<div class="exp"><div class="verdict ${ok?"ok":"no"}">${ok?"答對了":"答錯了，正確答案是 "+L[it.a]}</div><p>${it.e}</p>`;
    if(it.x&&it.x.length) h+=`<ul>${it.x.map(s=>`<li>${s}</li>`).join("")}</ul>`;
    if(it.w) h+=`<div class="warn">⚠ ${it.w}</div>`;
    if(it.r) h+=`<div class="ref">回導讀複習：${it.r}　<a href="${GUIDE}" target="_blank" rel="noopener">開啟導讀</a></div>`;
    h+=`</div>`;}
  h+=`<div class="nav"><button type="button" id="prev" ${pos<=0?"disabled":""}>上一題</button>
  <button type="button" class="primary" id="next" ${done?"":"disabled"}>${pos===ord.length-1?"看成績":"下一題"}</button></div></section>
  <p class="hint">${done?"":"點選一個選項作答"}</p>`;
  m.innerHTML=h;
  m.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ans[cur]=+b.dataset.j;save();render();});
  $("prev").onclick=()=>go(ord[pos-1]);
  $("next").onclick=()=>{ if(pos===ord.length-1){cur=-1;render();} else go(ord[pos+1]); };
}
function renderResult(){
  stats();
  const q=Q(); const done=Object.keys(ans).length, ok=Object.entries(ans).filter(([i,v])=>q[i].a===v).length;
  const wrong=q.map((_,i)=>i).filter(i=>i in ans && ans[i]!==q[i].a);
  const un=q.map((_,i)=>i).filter(i=>!(i in ans));
  let h=`<section class="card result"><h2>單元 ${unit} 成績</h2><div class="big">${ok} ／ ${q.length}</div><p>已作答 ${done} 題${un.length?`，還有 ${un.length} 題未作答`:""}。</p>`;
  if(wrong.length) h+=`<p>答錯的題目（點題號回去看解析）：</p><div class="wronglist">${wrong.map(i=>`<button type="button" data-i="${i}">${i+1}</button>`).join("")}</div>`;
  h+=`<div class="nav">${wrong.length?`<button type="button" class="primary" id="redo">只重做答錯的 ${wrong.length} 題</button>`:""}<button type="button" id="reset">本單元全部重來</button></div></section>`;
  $("main").innerHTML=h;
  $("main").querySelectorAll(".wronglist button").forEach(b=>b.onclick=()=>{onlyWrong=null;go(+b.dataset.i)});
  if($("redo")) $("redo").onclick=()=>{onlyWrong=wrong.slice(); wrong.forEach(i=>delete ans[i]); go(wrong[0]);};
  $("reset").onclick=()=>{ans={};onlyWrong=null;go(0)};
}
$("toggleGrid").onclick=()=>{const g=$("grid");g.hidden=!g.hidden;$("toggleGrid").setAttribute("aria-expanded",String(!g.hidden));};
try{const u=+localStorage.getItem("mbq-unit"); if(u>=1&&u<=10&&ready(u)) unit=u;}catch(e){}
if(!ready(unit)){for(let k=1;k<=10;k++){if(ready(k)){unit=k;break;}}}
load(); render();
}
</script>
</body></html>
